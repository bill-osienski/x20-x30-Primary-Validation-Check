        vlanEnable:
          type: boolean
        vlanID:
          type: integer
          minimum: 1
          maximum: 4092
      example:
        - vlanEnable: true
          vlanID: 100
        - vlanEnable: false
      oneOf: [
        {
          properties: {
            vlanEnable: { enum: [true] }
          },
          required: [ vlanID ]
