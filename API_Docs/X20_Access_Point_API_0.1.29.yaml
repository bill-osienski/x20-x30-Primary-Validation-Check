                    - cmac: 'ac:de:48:00:11:22'
                      networkIndex: 51
                      mac: 'ac:de:48:00:55:67'
                      ssid: arankis_init
                      interface: 5GHZ
                      name: Iron man Armor
                      cip: '192.168.1.191'
                      rx: 12300
                      tx: 67800
                      signal: -52
                      os: iOS
                    - cmac: 'ac:de:48:00:11:23'
                      networkIndex: 52
                      mac: 'ac:de:48:00:55:68'
                      ssid: arankis_init
                      interface: 5GHZ
                      name: Thor Hammer
                      cip: '192.168.1.192'
                      rx: 22300
                      tx: 77800
                      signal: -55
                      os: iOS
