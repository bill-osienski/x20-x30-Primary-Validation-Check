  /v1/wireless/network:
    post: # API Required APPLY # API is synchronous
      security:
        - bearerAuth: []
      tags:
        - Wireless
      summary: "Add WLAN Network configuration by interface"
      description: Add WLAN Network configuration by interface, 2.4GHZ, 5GHZ or BOTH
      operationId: anaAddNetworkByinterface
      requestBody:
        description: |
          Mesh mode doesn't support bandSteeringEnabled and traffic_shaping setting,
          there is only one VLAN ID for one band in mesh mode
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
                - ssid
                - security
                - wifi6
                - clientIsolation
                - broadcastEnabled
                - fastRoamingEnabled
                - interface
              properties:
                ssid:
                  type: string
                  minLength: 1
                  maxLength: 32
                enabled:
                  type: boolean
                interface:
                  type: string
                  enum: [ 2.4GHZ, 5GHZ, BOTH ]
                networkIdx:
                  description: Optional, POST BOTH with valid & exist networkIdx will extend single profile to both profile.
                  type: integer
                  enum: [ 0, 1, 2, 3, 4, 5, 6, 7, 50, 51, 52, 53, 54, 55, 56, 57 ]
                security:
                  type: string
                  enum:
                    - OPEN
                    - OWE
                    - WPA3
                    - WPA3-SAE MIXED
                    - WPA3-SAE
                    - WPA2-PSK
                    - WPA-PSK MIXED
                    - WPA2
                    - WPA MIXED
                password:
                  type: string
                  minLength: 8
                  maxLength: 128  #SAE maximum password length is 128bytes
                ofdm:
                  description: Required for 2.4GHz & BOTH interface, and hwmode 11b can't enable ofdm
                  type: boolean
                wifi6:
                  description: WIFI6 can be enable if 2.4G/5G hwmode is "802.11AX"
                  type: boolean
                powerSaving:
                  type: boolean
                clientIsolation:
                  type: boolean
                broadcastEnabled:
                  type: boolean
                dtimPeriod:
                  type: integer
                  minimum: 1
                  maximum: 255
                bcmcthreshold:
                  type: integer
                  minimum: 0
                  maximum: 64
                fastRoamingEnabled:
                  type: boolean
                bandSteeringEnabled:
                  type: boolean
                radius:
                  $ref: '#/components/schemas/Radius'
                vlan:
                  $ref: '#/components/schemas/Vlan'
                traffic_shaping:
                  $ref: '#/components/schemas/TrafficShaping'
              example:
                enabled: true
                interface: BOTH
                ssid: "EMPLUS"
                security: "WPA2-PSK"
                password: "12345678"
                ofdm: true
                wifi6: true
                powerSaving: false
                clientIsolation: true
                broadcastEnabled: true
                dtimPeriod: 20
                bcmcthreshold: 64
                fastRoamingEnabled: true
                bandSteeringEnabled: true
              oneOf: [
                {
                  properties: {
                    security: { enum: [WPA3, WPA2, WPA MIXED]  }
                  },
                  required: [ radius ]
                },
                {
                  properties: {
                    security: { enum: [WPA3-SAE MIXED, WPA3-SAE, WPA MIXED, WPA2-PSK, WPA-PSK MIXED]  }
                  },
                  required: [ password ]
                },
                {
                  properties: {
                    security: { enum: [OPEN, OWE]  }
                  }
                },
                {
                  properties: {
                    interface: { enum: [2.4GHZ]  }
                  },
                  required: [ ofdm ]
                }
              ]
      responses:
        '200':
          description: |
            Successful operation.
            Inside API Response structure, **errCode** value 0 indicate API execute successfully and
            non-zero value indicate error happened, **message** shows the reason.
          content:
            application/json:
              schema:
                type: object
                properties:
                  networkIndex:
                    type: array
                    uniqueItems: true
                    items:
                      type: integer
                      enum: [ 0, 1, 2, 3, 4, 5, 6, 7, 50, 51, 52, 53, 54, 55, 56, 57 ]
                  deviceId:
                    $ref: '#/components/schemas/macFormat'
                  errCode:
                    $ref: '#/components/schemas/errCodeEnum'
                  message:
                    type: string
                    enum: [ OK ]
    patch: # API Required APPLY # API is synchronous
      security:
        - bearerAuth: []
      tags:
        - Wireless
      summary: "Modify WLAN Network configuration by networkIndex"
      description: Modify WLAN Network configuration by networkIndex and interface
      operationId: anaModifyNetworkConfigBynetworkIndex
      requestBody:
        description: |
          Mesh mode doesn't support bandSteeringEnabled and traffic_shaping setting.
          There is only one VLAN ID for one band in mesh mode
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - networkIndex
                - interface
              properties:
                networkIndex:
                  type: array
                  uniqueItems: true
                  items:
                    type: integer
                    enum: [ 0, 1, 2, 3, 4, 5, 6, 7, 50, 51, 52, 53, 54, 55, 56, 57 ]
                ssid:
                  type: string
                  minLength: 1
                  maxLength: 32
                interface:
                  type: string
                  enum: [ 2.4GHZ, 5GHZ, BOTH ]
                enabled:
                  type: boolean
                security:
                  type: string
                  enum:
                    - OPEN
                    - OWE
                    - WPA3
                    - WPA3-SAE MIXED
                    - WPA3-SAE
                    - WPA2-PSK
                    - WPA-PSK MIXED
                    - WPA2
                    - WPA MIXED
                password:
                  type: string
                  minLength: 8
                  maxLength: 128  #SAE maximum password length is 128bytes
                ofdm:
                  description: Only for 2.4G interface, and hwmode 11b can't enable ofdm
                  type: boolean
                wifi6:
                  description: WIFI6 can be enable if 2.4G/5G hwmode is "802.11AX"
                  type: boolean
                powerSaving:
                  type: boolean
                clientIsolation:
                  type: boolean
                broadcastEnabled:
                  type: boolean
                dtimPeriod:
                  type: integer
                  minimum: 1
                  maximum: 255
                bcmcthreshold:
                  type: integer
                  minimum: 0
                  maximum: 64
                fastRoamingEnabled:
                  type: boolean
                bandSteeringEnabled:
                  type: boolean
                radius:
                  $ref: '#/components/schemas/Radius'
                vlan:
                  $ref: '#/components/schemas/Vlan'
                traffic_shaping:
                  $ref: '#/components/schemas/TrafficShaping'
              example:
                networkIndex: [0,50]
                security: OPEN
                ssid: araknis_initial
                enabled: true
                interface: BOTH
                ofdm: false
                wifi6: true
                powerSaving: false
                clientIsolation: true
                broadcastEnabled: true
                dtimPeriod: 20
                bcmcthreshold: 64
                fastRoamingEnabled: false
                bandSteeringEnabled: false
                vlan:
                  vlanEnable: true
                  vlanID: 55
                traffic_shaping:
