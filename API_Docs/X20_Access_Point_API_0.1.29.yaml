      properties:
        mode:
          type: string
          enum: [ Static, DHCP ]
        ip:
          $ref: '#/components/schemas/ipFormat'
        mask:
          $ref: '#/components/schemas/ipFormat'
        gateway:
          $ref: '#/components/schemas/ipFormat'
        primary_dns:
          $ref: '#/components/schemas/ipFormat'
        secondary_dns:
          $ref: '#/components/schemas/ipFormat'
