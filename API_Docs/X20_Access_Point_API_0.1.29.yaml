    System:
      type: object
      properties:
        DeviceID:
          type: string
          minLength: 17
          maxLength: 17
        STNumber:
          type: string
          minLength: 18
          maxLength: 18
        FWVersion:
          type: string
          minLength: 10
          maxLength: 11
        CPU:
          type: string
          minLength: 2
          maxLength: 4
        UTC:
          type: string
        Uptime:
          type: string
        memAvailable:
          type: string
        memUsed:
          type: string
        tempCPU:
          type: string
          minLength: 4
          maxLength: 5
        temp2G:
          type: string
          minLength: 4
          maxLength: 5
        temp5G:
          type: string
          minLength: 4
          maxLength: 5
        powerState:
          description: |
            enum list explain:
              * DC: Direct Current
              * BT: IEEE 802.3bt
              * AT: IEEE 802.3at
              * AF: IEEE 802.3af
              * NA: Not Available
          type: string
          enum:
            - DC
            - BT
            - AT
            - AF
            - NA
        activePartition:
          type: string
          enum:
            - '0'  #string
            - '1'  #string
            - 'NA' # Not Available
        watchdogTrigFlag:
          description: If Watchdog trigger Wi-Fi Module to reload, set flag to true.
          type: boolean
      example:
        DeviceID: 'D4:6A:91:12:34:56'
        STNumber: 'ST3456789012345678'
        FWVersion: 'V1.0.00.05'
        CPU: '5%'
        UTC: '2021-12-09T01:30:11Z'
        Uptime: '56 min'
        memAvailable: '12345678 KB'
        memUsed: '2345678 KB'
        tempCPU: '92°C'
        temp2G: '102°C'
        temp5G: '99°C'
        powerState: 'DC'
        activePartition: '1'
        watchdogTrigFlag: false
    Lan:
      type: object
      properties:
        interface:
          type: string
          enum:
            - LAN1
            - LAN2
            - LAN3
        ifStatus:
          type: string
          enum:
            - Connected
            - Not Connected
        ifSpeed:
          type: string
          enum:
            - --
            - 10Mbps
            - 100Mbps
            - 1Gbps
            - 2.5Gbps
        ifDuplex:
          type: string
          enum:
            - --
            - HALF
            - FULL
        TX:
          description: Unit is 'bytes'
          type: integer
          minimum: 0
          maximum: 4294967040
        RX:
          description: Unit is 'bytes'
          type: integer
          minimum: 0
          maximum: 4294967040
      example:
        - interface: 'LAN1'
          ifStatus: 'Connected'
          ifSpeed: '2.5Gbps'
          ifduplex: 'FULL'
          TX: 123456789
          RX: 123456789
        - interface: 'LAN2'
          ifStatus: 'Not Connected'
          ifSpeed: '--'
          ifduplex: '--'
          TX: 0
          RX: 0
    Radio:
      type: object
      properties:
        interface:
          type: string
          enum: [ 2.4GHz, 5GHz ]
        stateOfRadio:
          type: boolean
        TX:
          description: Unit is 'bytes'
          type: integer
          minimum: 0
          maximum: 4294967040
        RX:
          description: Unit is 'bytes'
          type: integer
          minimum: 0
          maximum: 4294967040
        networkCount:
          type: integer
          minimum: 1
          maximum: 8
        sumOfClients:
          type: integer
        opMode:
          type: string
          enum: [ AP, MESH ]
        opRole:
          type: string
          enum: [ --, CONTROLLER, NODE ]
        userSelectedChannel:
          type: string
          minLength: 1
          maxLength: 4
        channelBandWidth:
          type: string
          enum:
            - HT20
            - HT20_40
            - HT40
            - HT80
            - HT160  # for AN520 only
        channelutilization:
          type: string
          minLength: 2
          maxLength: 4
        channelCurrentlyUsed:
          type: integer
          minimum: 1
          maximum: 196
        stateOfGuestNetwork:
          type: boolean
      example:
        - interface: '2.4GHz'
          stateOfRadio: true
          TX: 12345678
          RX: 12345678
          networkCount: 1
          sumOfClients: 2
          opMode: 'AP'
          opRole: '--'
          userSelectedChannel: 'AUTO'
          channelBandWidth: 'HT20'
          channelutilization: '100%'
          channelCurrentlyUsed: 6
          stateOfGuestNetwork: true
        - interface: '5GHz'
          stateOfRadio: true
          TX: 12345678
          RX: 12345678
          networkCount: 2
          sumOfClients: 3
          opMode: 'AP'
          opRole: '--'
          userSelectedChannel: 'AUTO'
          channelBandWidth: 'HT80'
          channelutilization: '23%'
          channelCurrentlyUsed: 149
          stateOfGuestNetwork: false
    dfs:
      type: object
      properties:
        dfs:
          type: boolean
        count:
          type: integer
          minimum: 0
        date:
          type: string
          minLength: 2  # --
          maxLength: 8
        time:
          type: string
          minLength: 2  # --
          maxLength: 8
      example:
        dfs: true
        count: 3
        date: '12/01/21'
        time: '09:59:47'
    counter:
      description: |
        For debug purpose, station can not connect to 2G radio with WPA2/3 - personal after serval days.
      type: object
      properties:
        txDescInUse2g:
          type: integer
          minimum: 0
        rxDescInUse2g:
          type: integer
          minimum: 0
        rxDescInUse5g:
          type: integer
          minimum: 0
      example:
        txDescInUse2g: 168
        rxDescInUse2g: 4095
        rxDescInUse5g: 4095
    meshInfo:
      type: object
      properties:
        meshBackhaul: # only displayed in MESH mode
          description: |
            **Note** Controller always displays Wired
          type: string
          enum: [ 2G, 5G, Wired, -- ]
    toggleState:
      type: object
      properties:
        toggle:
          description: Only displayed in MESH mode
          type: boolean
        status:
          type: array
          items:
            type: object
            properties:
              nodeMAC:
                type: string
              ledBehavior:
                type: string
                enum: [ blinking, solid ]
              ledColor:
                type: string
                enum: [ white, red, yellow, skyblue ]
      example:
        - toggle: true
          status:
          - nodeMAC: 00:22:33:44:55:66
            ledBehavior: blinking
            ledColor: white
          - nodeMAC: 00:22:33:44:55:67
            ledBehavior: solid
            ledColor: red
        - toggle: false
    wifiBridge:
      type: object
      properties:
        enable:
          type: boolean
        role:
          type: string
          description: This key show wireless bridge actual connection status
          enum:
            - 'Wired Bridge'
            - 'Wireless Bridge'
            - '--'
      example:
        enable: true
        role: 'Wireless Bridge'
    wifiBridgeConfig:
      type: object
      properties:
        enable:
          type: boolean
        radio:
          type: string
          enum: [ "2.4GHZ", "5GHZ" ]
        role:
          type: string
          enum:
            - 'Wired Bridge'      # mapping AP config
            - 'Wireless Bridge'   # mapping STA config (default)
        security:
          type: string # WPA3-SAE only for now
        ssid:
          type: string
        localBssid:
          $ref: '#/components/schemas/macFormat'
        remoteBssid:
          $ref: '#/components/schemas/macFormat'
        key:
          type: string
          minLength: 8
          maxLength: 64
      example:
        enable: true
        radio: '5GHZ'
        role: 'Wired Bridge'
        security: 'WPA3-SAE'
        ssid: 'wlanBridge5G'
        localBssid: '00:aa:bb:cc:dd:ee'
        remoteBssid: '00:11:22:33:44:55'
        key: '12345678'
    wifiBridgeStatus:
      type: object
      properties:
        role:
          type: string
          description: This key show wireless bridge actual connection status, the same as /sys/status-update -> wifiBridge -> uplinkType
          enum:
            - 'Wired Bridge'
            - 'Wireless Bridge'
            - '--'
        uptime:
          type: string
        connection:
          type: string
          enum: [ 'Online', 'Offline' ]
      example:
        role: 'Wired Bridge'
        uptime: '0 d 20 h 45 m 54 s'
        connection: 'Online'
