          minLength: 17
          maxLength: 17
        fw_ver:
          type: string
          minLength: 7
          maxLength: 16
        fw_build_date:
          type: string
          minLength: 10
          maxLength: 10
        country_code:   # FCC only display 840
          readOnly: true
          type: integer
          enum:
            - 8     # Albania
            - 36    # Australia
            - 40    # Austria
            - 56    # Belgium
            - 100   # Bulgaria
            - 124   # Canada
            - 191   # Croatia
            - 196   # Cyprus
            - 203   # Czech Republic
            - 208   # Denmark
            - 233   # Estonia
            - 246   # Finland
            - 250   # France
            - 276   # Germany
            - 300   # Greece
            - 348   # Hungary
            - 352   # Iceland
            - 372   # Ireland
            - 376   # Israel
            - 380   # Italy
            - 428   # Latvia
            - 438   # Liechtenstein
            - 440   # Lithuania
            - 442   # Luxembourg
            - 470   # Malta
            - 499   # Montenegro
            - 528   # Netherlands
            - 530   # Netherlands Antilles
            - 554   # New Zealand
            - 578   # Norway
            - 616   # Poland
            - 620   # Portugal
            - 642   # Romania
            - 643   # Russia
            - 688   # Serbia
            - 703   # Slovakia
            - 705   # Slovenia
            - 724   # Spain
            - 752   # Sweden
