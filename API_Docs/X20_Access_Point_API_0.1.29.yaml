        radiusPort: 1812
        radiusSecret: secret1812
        accountingEnabled: true
        accountingServer: 10.0.0.8
        accountingPort: 1813
        accountingSecret: secret1813
        accountingInterval: 600
    Vlan:
      required:
        - vlanEnable
