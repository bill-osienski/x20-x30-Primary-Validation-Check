openapi: 3.0.0
info:
  version: 0.1.29
  title: "SnapOne AN-x20 RESTful API"
  description: The document declares RESTful APIs used in SnapOne AN-x20 product
servers:
  - url: 'https://192.168.1.1:4431/api'
  - url: 'http://192.168.1.1:8001/api'
  - url: 'https://127.0.0.1:4431/api'
  - url: 'http://127.0.0.1:8001/api'
tags:
  - name: Sys
    description: Supported by EMPLUS
  - name: Tools
    description: Supported by EMPLUS
  - name: Ethernet
    description: Supported by EMPLUS
  - name: Mesh
    description: Supported by EMPLUS
  - name: Wireless
    description: Supported by EMPLUS
paths:
  /v1/sys/login:
    post: # API is synchronous
      tags:
        - Sys
      summary: "Login to API server"
      description: Login to API server
      operationId: anaLogin
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login
              properties:
                login:
                  $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: |
            Successful operation.
            Inside API Response structure, **errCode** value 0 indicate API execute successfully and
            non-zero value indicate error happened, **message** shows the reason.
          content:
            application/json:
              schema:
                type: object
                properties:
                  login:
                    $ref: '#/components/schemas/Login_Token'
                  deviceId:
                    type: string
                    minLength: 17
                    maxLength: 17
                  errCode:
                    $ref: '#/components/schemas/errCodeEnum'
                  message:
                    type: string
                    enum: [ OK ]
  /v1/sys/status-update:
    get: # API is synchronous
      security:
        - bearerAuth: []
      tags:
        - Sys
      summary: "Status update, include system, LAN and WiFi"
      description: Status update, include system, LAN and WiFi
      responses:
        '200':
          description: |
            Successful operation.
            Inside API Response structure, **errCode** value 0 indicate API execute successfully and
            non-zero value indicate error happened, **message** shows the reason.
            DFS date : YYYY/MM/DD, DFS time is UTC format'
          content:
            application/json:
              schema:
                type: object
                properties:
                  system:
                    $ref: '#/components/schemas/System'
                  ethernet:
                    type: array
                    uniqueItems: true
                    items:
                      $ref: '#/components/schemas/Lan'
                  radio:
                    type: array
                    uniqueItems: true
                    items:
                      $ref: '#/components/schemas/Radio'
                  dfs:
                    $ref: '#/components/schemas/dfs'
                  counter:
                    $ref: '#/components/schemas/counter'
                  mesh:
                    $ref: '#/components/schemas/meshInfo'
                  wifiBridge:
                    $ref: '#/components/schemas/wifiBridge'
                  deviceId:
                    type: string
                    minLength: 17
                    maxLength: 17
                  errCode:
                    $ref: '#/components/schemas/errCodeEnum'
                  message:
                    type: string
                    enum: [ OK ]
