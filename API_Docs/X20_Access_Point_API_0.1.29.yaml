      example:
        radio: all
    SiteSurvey_ScanResult:
      type: array
      uniqueItems: true
      items:
        type: object
        properties:
          bssid:
            type: string
            minLength: 17
            maxLength: 17
          ssid:
            type: string
            minLength: 1
            maxLength: 32
          mode:
            type: string
            enum: [ AP ]
          channel:
            type: integer
            minimum: 0
            maximum: 196
          signal:
            type: integer
          auth_type:
            type: string
            enum:
              - OPEN
              - WEP
              - WPA-PSK
              - WPA-PSK Mixed
              - WPA Mixed
              - WPA2-PSK
              - WPA2
              - WPA3-SAE
              - WPA3-SAE Mixed
              - WPA3
              - OWE
          wireless_mode:
            type: string
            enum:
              - a_mode
              - n_mode
              - an_mode
              - aac_mode
              - nac_mode
              - anac_mode
              - ac_mode
              - b_mode  # b mode can't support 2.4G OFDM
              - g_mode
              - bg_mode
              - gn_mode
              - bgn_mode
          ht_mode:
            type: string
            enum:
              - HT20
              - HT40
              - HT80
              - HT160  # for AN520 only
        example:
          bssid: '00:0F:FF:3F:5C:20'
          ssid: 'wireless_init'
          mode: 'AP'
          channel: 157
          signal: -33
          auth_type: 'WPA2-PSK'
          wireless_mode: 'anac_mode'
          ht_mode: 'HT80'
    SiteSurvey_Summary:
      type: array
      uniqueItems: true
      items:
        type: object
        properties:
          channel:
            type: integer
            minimum: 1
            maximum: 196
          ssid_count:
            type: integer
          utilization:
            type: integer
          max_rssi:
            type: integer
          isBest:
            type: boolean
    SiteSurveyData:
      type: object
      properties:
        scanResult:
          $ref: '#/components/schemas/SiteSurvey_ScanResult'
        summary:
          $ref: '#/components/schemas/SiteSurvey_Summary'
    SiteSurveyResult:
      type: object
      properties:
        24g:
          $ref: '#/components/schemas/SiteSurveyData'
        5g_1:
          $ref: '#/components/schemas/SiteSurveyData'
      example:
        24g:
          scanResult:
            bssid: 00:0F:FF:3F:5C:20
            ssid: 'wireless_init'
            mode: 'AP'
            channel: 6
            signal: -33
            auth_type: 'WPA2-PSK'
            wireless_mode: 'bgn_mode'
            ht_mode: 'HT20'
          summary:
            channel: 1
            ssid_count: 5
            utilization: 30
            max_rssi: -30
            isBest: true
        5g_1:
          scanResult:
            bssid: 00:0F:FF:3F:5C:21
            ssid: 'wireless_init'
            mode: 'AP'
            channel: 136
            signal: -33
            auth_type: 'WPA2-PSK'
            wireless_mode: 'anac_mode'
            ht_mode: 'HT80'
          summary:
            channel: 36
            ssid_count: 5
            utilization: 40
            max_rssi: -30
            isBest: true
