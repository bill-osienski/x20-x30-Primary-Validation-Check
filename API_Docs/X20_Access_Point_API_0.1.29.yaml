    ServiceConfig:
      type: object
      required:
        - https_enable
        - web_access_enable
        - telnet_enable
        - ssh_enable
        - bonjour_enable
        - upnp_enable
      properties:
        https_enable:
          type: boolean
        https_port:
          type: integer
          minimum: 1
          maximum: 65535
        web_access_enable:
          type: boolean
        http_port:
          type: integer
          minimum: 1
          maximum: 65535
        telnet_enable:
          type: boolean
        ssh_enable:
          type: boolean
        bonjour_enable:
          type: boolean
        upnp_enable:
          type: boolean
      anyOf: [
        {
          properties: {
            https_enable: { enum: [true] }
          },
          required: [ https_port, web_access_enable, telnet_enable, ssh_enable, bonjour_enable, upnp_enable ]
        },
        {
          properties: {
            https_enable: { enum: [false] }
          },
          required: [ http_port, web_access_enable, telnet_enable, ssh_enable, bonjour_enable, upnp_enable ]
        },
      ]
      example:
        https_enable: true
        https_port: 4430
        web_access_enable: true
        http_port: 80
        telnet_enable: true
        ssh_enable: true
        bonjour_enable: true
        upnp_enable: true
