    TraceRTOK:
      type: object
      properties:
        dest_ip:
          type: string
          minLength: 7
        session_id:
          type: string
        session_num:
          type: integer
        pid:
          type: integer
          minimum: 2
          maximum: 32768  #default maximum, see /proc/sys/kernel/pid_max
        deviceId:
          type: string
          minLength: 17
          maxLength: 17
        errCode:
          type: integer
        message:
          type: string
      example:
        dest_ip: www.google.com.tw
        session_id: ead17895-5855-4ca9-8510-b04abf402092
        session_num: 9
        pid: 12344
        deviceId: D4:6A:91:55:66:11
        errCode: 0
        message: OK
    PingOK:
      type: object
      properties:
        dest_ip:
          type: string
          minLength: 7
        size:
          type: integer
          minimum: 64
          maximum: 20480
        count:
          type: integer
          minimum: 1
          maximum: 9999
        session_id:
          type: string
        session_num:
          type: integer
        pid:
          type: integer
          minimum: 2
          maximum: 32768  #default maximum, see /proc/sys/kernel/pid_max
        deviceId:
          type: string
          minLength: 17
          maxLength: 17
        errCode:
          type: integer
        message:
          type: string
      example:
        dest_ip: 192.168.20.101
        size: 1024
        count: 4
        session_id: ead17895-5855-4ca9-8510-b04abf402092
        session_num: 9
        pid: 22375
        deviceId: D4:6A:91:55:66:11
        errCode: 0
        message: OK
    TrafficShaping:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        download_limit:
          description: Unit is 'Mbps'
          type: integer
          minimum: 1
          maximum: 2402
        upload_limit:
          description: Unit is 'Mbps'
          type: integer
          minimum: 1
          maximum: 2402
      example:
        enabled: true
        download_limit: 450
        upload_limit: 450
      oneOf: [
        {
          properties: {
            enabled: { enum: [true] }
          },
          required: [ download_limit, upload_limit ]
        },
        {
          properties: {
            enabled: { enum: [false] }
          }
        }
      ]
    GWMonitorConfig:
      type: object
      required:
        - enable
        - gw_ip_address
        - delay_between_timeout
        - timeout_before_reboot
        - ping_delay
        - reboot_attempt
      properties:
        enable:
          type: boolean
        gw_ip_address:
          $ref: '#/components/schemas/ipFormat'
        delay_between_timeout:
          type: integer
          minimum: 10
          maximum: 60
        timeout_before_reboot:
          type: integer
          minimum: 3
          maximum: 10
        ping_delay:
          type: integer
          minimum: 5
          maximum: 30
        reboot_attempt:
          type: integer
          minimum: 0    # 0=Infinite reboot
          maximum: 10
      example:
        enable: true
        gw_ip_address: "192.168.1.254"
        delay_between_timeout: 40
        timeout_before_reboot: 3
        ping_delay: 25
        reboot_attempt: 7
    ShowUserInfo:
      type: object
      required:
        - name
        - privilege
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 32
        privilege:
          type: string
          enum: [ admin, user, guest ]
    ShowUserArray:
      type: array
      uniqueItems: true
      items:
        $ref: '#/components/schemas/ShowUserInfo'
    UserInfo:
      type: object
      required:
        - enable
        - name
        - privilege
        - password
      properties:
        enable:
          type: boolean
        name:
          type: string
          minLength: 4
          maxLength: 32
        privilege:
          type: string
          enum: [ admin, user, guest ]
        password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 64
    UserArray:
      type: array
      uniqueItems: true
      items:
        $ref: '#/components/schemas/UserInfo'
      example:
        - enable: true
          name: araknis
          privilege: admin
          password: "!@#$%^&*(i)_+ 9.-?431243124312431243124312431243124312431243124Z"
        - enable: false
          name: iamuser
          privilege: user
          password: "Emplus702!"
        - enable: true
          name: iamguest
          privilege: guest
          password: "Emplus703!"
        - enable: true
          name: test
          privilege: guest
          password: "Emplus704!"
    DeviceInfo:
