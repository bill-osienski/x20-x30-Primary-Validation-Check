                    type: string
                    enum: [ OK ]
                example:
                  deviceId: D4:6A:91:55:66:11
                  errCode: 0
                  message: OK
                  config:
                    opMode: AP
                    opRole: CONTROLLER
                    system_name: AN-520-AP-I
                    country_code: 840
                    led_enable: false
                    resetPassword_enable: false
