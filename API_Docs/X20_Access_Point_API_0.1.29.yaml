          description: Site survey session id
          required: true
          schema:
            type: string
        - in: query
          name: radio
          description: |
            which radio of sitesurvey result you want to get, ex:24g, 5g_1, 5g_2
            or all
          required: true
          schema:
            type: string
            enum: [ 24g, 5g_1, all ]
      responses:
        '200':
          description: |
            Successful operation.
            Inside API Response structure, **errCode** value 0 indicate API execute successfully and
            non-zero value indicate error happened, **message** shows the reason.
            If encounter "errCode": 16, Please reacquire result data after $interval second.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    siteSurveyResult:
                      $ref: '#/components/schemas/SiteSurveyResult'
                    deviceId:
                      type: string
                      minLength: 17
                      maxLength: 17
                    errCode:
                      $ref: '#/components/schemas/errCodeEnum'
                    message:
                      type: string
                      enum: [ OK ]
                - type: object
                  properties:
                    deviceId:
                      type: string
                      minLength: 17
                      maxLength: 17
                    errCode:
                      $ref: '#/components/schemas/errCodeEnum'
                    paraMsgs:
                      type: array
                      uniqueItems: true
                      items:
                        type: object
                        properties:
                          object:
                            type: string
                          interval:
                            type: integer
                          objectValue:
                            type: string
              examples:
                errCode_0:
                  value:
                    siteSurveyResult:
                      24g:
                        scanResult:
                          - bssid: "00:0F:FF:3F:5C:20"
                            ssid: "wireless_init2g"
                            mode: "AP"
                            channel: 6
                            signal: -33
                            auth_type: "WPA2-PSK"
                            wireless_mode: "11NG"
                            ht_mode: "HT20"
                        summary:
                          - channel: 1
                            ssid_count: 5
                            utilization: 30
                            max_rssi: -30
                            isBest: true
                      5g_1:
                        scanResult:
                          - bssid: "00:0F:FF:3F:5C:21"
                            ssid: "wireless_init5g"
                            mode: "AP"
                            channel: 136
                            signal: -33
                            auth_type: "WPA2-PSK"
                            wireless_mode: "11AC"
                            ht_mode: "HT80"
                        summary:
                          - channel: 36
                            ssid_count: 5
                            utilization: 40
                            max_rssi: -30
                            isBest: true
                    deviceId: "D4:6A:91:55:66:11"
                    errCode: 0
                    message: "OK"
                errCode_16:
                  value:
                    deviceId: "D4:6A:91:55:66:11"
                    errCode: 16
                    paraMsgs:
                      - object: "Sitesurvey"
                        interval: 5
                        objectValue: "Site survey is still in the process, please get data later"
