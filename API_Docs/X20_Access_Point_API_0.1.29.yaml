          type: integer
          minimum: 1
          maximum: 4092
      anyOf: [
        {
          properties: {
            mode: { enum: [Static] },
            mgmt_vlan_tagged: { enum: [true] }
          },
          required: [ ip, mask, gateway, primary_dns, secondary_dns, mgmt_vlan_id ]
        },
        {
          properties: {
            mode: { enum: [Static] },
            mgmt_vlan_tagged: { enum: [false] }
          },
          required: [ ip, mask, gateway, primary_dns, secondary_dns ]
        },
        {
          properties: {
            mode: { enum: [DHCP] },
            mgmt_vlan_tagged: { enum: [true] }
          },
          required: [ mgmt_vlan_id ]
        },
        {
          properties: {
            mode: { enum: [DHCP] },
            mgmt_vlan_tagged: { enum: [false] }
          }
        },
      ]
    SNMPv2Config:
      type: object
      required:
        - enable
        - contact
        - location
        - port
        - readCommunity
        - writeCommunity
        - trapServerIPAddress
        - trapServerPort
        - trapCommunity
      properties:
        enable:
          type: boolean
        contact:
          type: string
        location:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        readCommunity:
          type: string
        writeCommunity:
          type: string
        trapServerIPAddress:
          $ref: '#/components/schemas/ipFormat'
        trapServerPort:
          type: integer
          minimum: 1
          maximum: 65535
        trapCommunity:
          type: string
      example:
        enable: true
        contact: Bruce li
        location: 3rdfloor
        port: 161
        readCommunity: public
        writeCommunity: private
        trapServerIPAddress: 192.168.20.20
        trapServerPort: 162
        trapCommunity: public
    SNMPv3Config:
      type: object
      required:
        - enable
        - username
        - authProtocol
        - authKey
        - privProtocol
        - privKey
        - engineId
      properties:
        enable:
          type: boolean
        username:
          type: string
          minLength: 1
          maxLength: 32
        authProtocol:
          type: string
          enum: [ MD5, SHA, None ]
        authKey:
          type: string
          minLength: 8
          maxLength: 32
        privProtocol:
          type: string
          enum: [ DES, None ]
        privKey:
          type: string
          minLength: 8
          maxLength: 32
        engineId:
          type: string
          #minLength: 1  #default value is empty
          maxLength: 32
      example:
        enable: true
        username: admin
        authProtocol: MD5
        authKey: '12345678'
        privProtocol: DES
        privKey: '12345678'
        engineId: '1234'
    SNMPConfig:
      type: object
      properties:
        v2:
          $ref: '#/components/schemas/SNMPv2Config'
        v3:
          $ref: '#/components/schemas/SNMPv3Config'
