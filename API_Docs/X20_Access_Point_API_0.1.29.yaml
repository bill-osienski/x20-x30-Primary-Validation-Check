                  message:
                    type: string
                    enum: [ OK ]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    macFormat:
      description: MAC address, colon(:) separated, UPPERCASE
      type: string
      pattern: '^[A-F0-9]{2}(:[A-F0-9]{2}){5}$'  #XX:XX:XX:XX:XX:XX,  X:'upper case' or 'numeric'
      minLength: 17
      maxLength: 17
      example:
        - 4C:13:65:11:22:3F
    ipFormat:
      description: min value = 1.1.1.1 - max value = 255.255.255.255
      type: string
      pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])$'
      example: 192.168.1.1
      minLength: 7
      maxLength: 15
    errCodeEnum:
      type: integer
      enum:
      - 0   # OK
      - 1   # redirect
      - 2   # device id not found
      - 3   # device id not match
      - 4   # invalid parameter
      - 5   # invalid provilege
      - 6   # API not found
      - 7   # system firmware upgrade event
      - 8   # version not found
      - 9   # version not supported
      - 10  # create JSON fail
      - 11  # invalid mesh role
      - 12  # no available network
      - 16  # Reacquire site survey data
      - 17  # Site survey failure
    SuccessTime:
      required:
        - deviceId
        - errCode
        - waitingTime
      type: object
      properties:
        deviceId:
          type: string
          minLength: 17
          maxLength: 17
        waitingTime:
          type: integer
        errCode:
          $ref: '#/components/schemas/errCodeEnum'
        message:
          type: string
          enum: [ OK ]
    Success:
      required:
        - deviceId
        - errCode
      type: object
      properties:
        deviceId:
          type: string
          minLength: 17
          maxLength: 17
        errCode:
          $ref: '#/components/schemas/errCodeEnum'
        message:
          type: string
          enum: [ OK ]
    DeviceMAC:
      type: object
      properties:
        deviceMAC:
          type: string
          minLength: 17
          maxLength: 17
    SystemInfo:
      type: object
      properties:
        system:
          $ref: '#/components/schemas/CpuMemStatus'
        temperature:
          $ref: '#/components/schemas/Temperature'
        power:
          $ref: '#/components/schemas/PowerStatus'
        lan:
          $ref: '#/components/schemas/EthernetStatus'
        radios:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SystemRadioStatus'
    CpuMemStatus:
      type: object
      properties:
        cpu:
          type: string
        memFree:
          description: Unit is 'KBytes'
          type: integer
        memUsed:
          type: string
          minimum: 1
      example:
        cpu: '37%'
        memFree: 12345678
        memUsed: '50%'
    Temperature:
      type: object
      properties:
        tempCPU:
          type: string
        temp2G:
          type: string
        temp5G:
          type: string
      example:
        tempCPU: '61°C'
        temp2G: '84°C'
        temp5G: '86°C'
    PowerStatus:
      type: object
      properties:
        powerState:
          description: |
            enum list explain:
              * DC: Direct Current
              * BT: IEEE 802.3bt
              * AT: IEEE 802.3at
              * AF: IEEE 802.3af
              * NA: Not Available
          type: string
          enum:
            - DC
            - BT
            - AT
            - AF
            - NA
    EthernetStatus:
      type: object
      properties:
        rx:
          description: Unit is 'bytes'
          type: integer
          minimum: 0
          maximum: 4294967040
        tx:
          description: Unit is 'bytes'
          type: integer
          minimum: 0
          maximum: 4294967040
    SystemRadioStatus:
      type: object
      properties:
        interface:
          description: Dual band and un-configured tri-band Node won't have 5GHz-2 information
          type: string
          enum: [ 2.4GHZ, 5GHZ, 5GHz-2]
        enabled:
          type: boolean
        rx:
          description: Unit is 'bytes'
          type: integer
          minimum: 0
          maximum: 4294967040
        tx:
          description: Unit is 'bytes'
          type: integer
          minimum: 0
          maximum: 4294967040
        networks:
          type: integer
        clients:
          type: integer
    SystemCfg:
      type: object
      required:
        - opMode
        - opRole
        - led_enable
        - resetPassword_enable
      properties:
        opMode:
          type: string
          enum: [ AP, MESH ]
        opRole:
          type: string
          enum: [ CONTROLLER, NODE ]
        system_name:
          type: string
        country_code:
          description: |
            optional, FCC only support 840.
            For outdoor device, country code can not be set to CE region if dfs was disabled
          type: integer
          enum:
            - 8     # Albania
            - 36    # Australia
            - 40    # Austria
            - 56    # Belgium
            - 100   # Bulgaria
            - 124   # Canada
            - 191   # Croatia
            - 196   # Cyprus
            - 203   # Czech Republic
            - 208   # Denmark
            - 233   # Estonia
            - 246   # Finland
            - 250   # France
            - 276   # Germany
            - 300   # Greece
            - 348   # Hungary
            - 352   # Iceland
            - 372   # Ireland
            - 376   # Israel
            - 380   # Italy
            - 428   # Latvia
            - 438   # Liechtenstein
            - 440   # Lithuania
            - 442   # Luxembourg
            - 470   # Malta
            - 499   # Montenegro
            - 528   # Netherlands
            - 530   # Netherlands Antilles
            - 554   # New Zealand
            - 578   # Norway
            - 616   # Poland
            - 620   # Portugal
            - 642   # Romania
            - 643   # Russia
            - 688   # Serbia
            - 703   # Slovakia
            - 705   # Slovenia
            - 724   # Spain
            - 752   # Sweden
            - 756   # Switzerland
            - 792   # Turkey
            - 807   # The Former Yugoslav Republic of Macedonia
            - 826   # United Kingdom
            - 840   # United States
        led_enable:
          description: |
            *NOTE* Required on non-outdoor product
          type: boolean
        resetPassword_enable:
          type: boolean
    WiFiClientInfo:
      type: object
      properties:
        cmac:
          type: string
          minLength: 17
          maxLength: 17
        networkIndex:
          type: integer
          enum: [ 0, 1, 2, 3, 4, 5, 6, 7, 50, 51, 52, 53, 54, 55, 56, 57 ]
        mac:
          type: string
          minLength: 17
          maxLength: 17
        ssid:
          type: string
          minLength: 1
          maxLength: 32
        interface:
          type: string
        name:
          type: string
        cip:
          $ref: '#/components/schemas/ipFormat'
        rx:
          description: Unit is 'bytes'
          type: integer
          minimum: 0
          maximum: 4294967040
        tx:
          description: Unit is 'bytes'
          type: integer
          minimum: 0
          maximum: 4294967040
        signal:
          type: integer
        os:
          type: string
    MacAddress:
      type: object
      properties:
        mac_address:
          type: string
          minLength: 17
          maxLength: 17
      example:
        mac_address: '00:02:6F:11:11:11'
    AclConfigure:
      required:
        - enabled
        - black_mac_list
        - white_mac_list
        - policy
        - schedule_enabled
        - schedule_templates
        - week_schedule
      type: object
      properties:
        enabled:
          type: boolean
        black_mac_list:
          type: string
        white_mac_list:
          type: string
        policy:
          type: string
          enum: [ DENY, ALLOW ]
        schedule_enabled:
          type: boolean
        schedule_templates:
          type: integer
          description: |
            - 2: Available 8-17 daily
            - 3: Available 8-17 daily except weekends
            - 4: Custom Schedule
        week_schedule:
          $ref: '#/components/schemas/WeekSch'
      example:
        enabled: false
        black_mac_list: '00:11:11:11:11:11 00:22:22:22:22:22'
        white_mac_list: '00:11:11:11:11:11 00:22:22:22:22:22'
        policy: 'ALLOW'
        schedule_enabled: true
        schedule_templates: 2
        week_schedule:
          su:
            available: true
            start: "00:00"
            end: "24:00"
          mo:
            available: true
            start: "00:00"
            end: "24:00"
          tu:
            available: true
            start: "00:00"
            end: "24:00"
          we:
            available: true
            start: "00:00"
            end: "24:00"
          th:
            available: true
            start: "00:00"
            end: "24:00"
          fr:
            available: true
            start: "00:00"
            end: "24:00"
          sa:
            available: true
            start: "00:00"
            end: "24:00"
    EthernetPortStatus:
      type: object
      properties:
        speed:
          type: string
          enum:
            - Not Connected
            - 10Mbps
            - 100Mbps
            - 1Gbps
            - 2.5Gbps
        duplexMode:
          type: string
          enum: [ --, FULL, HALF ]
        macaddress:
          type: string
          minLength: 17
          maxLength: 17
        rx:
          description: Unit is 'bytes'
          type: integer
          minimum: 0
          maximum: 4294967040
        tx:
          description: Unit is 'bytes'
          type: integer
          minimum: 0
          maximum: 4294967040
      example:
        speed: 1Gbps
        duplexMode: FULL
        macAddress: 00:02:6F:11:11:11
        rx: 329612
        tx: 328765
    EthernetPortStatuses:
      type: object
      properties:
        'LAN1':
          $ref: '#/components/schemas/EthernetPortStatus'
        'LAN2':
          $ref: '#/components/schemas/EthernetPortStatus'
    EthernetPortConf:
      required:
        - speed
      type: object
      properties:
        speed:
          type: string
          enum:
            - Auto
            - Disable
            - 10Mbps
            - 100Mbps
            - 1Gbps
            - 2.5Gbps
        duplexMode:
          type: string
          enum: [ FULL, HALF ]
        reset:
          description: outdoor model only
          type: boolean
      example:
        - speed: 1Gbps
        - speed: 100Mbps
          duplexMode: HALF
        - reset: true
      oneOf: [
        {
          properties: {
            speed: { enum: [ Auto, Disable, 1Gbps, 2.5Gbps ] }
          }
        },
        {
          properties: {
            speed: { enum: [ 10Mbps, 100Mbps ] }
          },
          required: [ duplexMode ]
        }
      ]
    EthernetPortConfs:
      type: object
      description: Only LAN2 has reset boolean properties
