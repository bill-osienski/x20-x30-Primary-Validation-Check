          minLength: 1
          maxLength: 64
        accountingEnabled:
          type: boolean
        accountingServer:
          $ref: '#/components/schemas/ipFormat'
        accountingPort:
          type: integer
          minimum: 1
          maximum: 65535
        accountingSecret:
          type: string
          minLength: 1
          maxLength: 64
        accountingInterval:
          type: integer
          minimum: 60
          maximum: 600
      example:
