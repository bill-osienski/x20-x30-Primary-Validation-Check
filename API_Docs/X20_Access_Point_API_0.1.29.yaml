  /v1/wireless/radioconfig:
    post: # API Required APPLY # API is synchronous
      security:
        - bearerAuth: []
      tags:
        - Wireless
      summary: "Set WLAN Radio configuration"
      description: Set WLAN Radio configuration
      operationId: anaSetRadioConfig
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              required:
                - radioconfig
              type: object
              properties:
                radioconfig:
                  required:
                    - interface
                    - enabled
                    - wirelessMode
                    - channel
                    - channelWidth
                    - transmitPower
                    - cts_rts_threshold
                    - client_limit_enabled
                    - client_limit
                  type: object
                  properties:
                    interface:
                      type: string
                      enum: [ 2.4GHZ, 5GHZ ]
                    enabled:
                      type: boolean
                    wirelessMode:
                      type: string
                      enum:
                        - 802.11B
                        - 802.11G
                        - 802.11BG
                        - 802.11BGN
                        - 802.11N
                        - 802.11A
                        - 802.11AN
                        - 802.11ACN
                        - 802.11AX  # 11AX can enable WIFI6
                    channel:
                      type: integer
                      minimum: 0
                      maximum: 196
                    ext_channel:
                      type: string
                      enum: [ lower, upper ]
                    channelWidth:
                      type: string
                      enum:
                        - HT20
                        - HT20_40
                        - HT40
                        - HT80
                        - HT160  # for AN520 only
                    transmitPower:
                      type: integer
                    cts_rts_threshold:
                      type: integer
                    qam256:
                      description: 2.4G only, not required
                      type: boolean
                    dfs:
                      description: |
                        5G only, not required
                        For outdoor device, DFS can not be disable if current country_code is at CE region
                      type: boolean
                    client_limit_enabled:
                      type: boolean
                    client_limit:
                      type: integer
                      minimum: 1
                      maximum: 127
              example:
                radioconfig:
                  interface: '2.4GHZ'
                  enabled: true
                  wirelessMode: 802.11AX
                  channel: 0
                  ext_channel: "upper"
                  channelWidth: "HT40"
                  transmitPower: 21
                  cts_rts_threshold: 2346
                  qam256: true
                  client_limit_enabled: true
                  client_limit: 127
      responses:
        '200':
          description: |
            Successful operation.
            Inside API Response structure, **errCode** value 0 indicate API execute successfully and
            non-zero value indicate error happened, **message** shows the reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
    get: # API is synchronous
      security:
        - bearerAuth: []
      tags:
        - Wireless
      summary: "Return WLAN Radio configuration"
      description: Return WLAN Radio configuration
      operationId: anaGetRadioConfig
      parameters:
        - in: query
          name: interface
          required: true
          schema:
            type: string
            enum: [ 2.4GHZ, 5GHZ ]
      responses:
        '200':
          description: |
            Successful operation.
            Inside API Response structure, **errCode** value 0 indicate API execute successfully and
            non-zero value indicate error happened, **message** shows the reason.
          content:
            application/json:
              schema:
                type: object
                properties:
                  radioconfig:
                    type: object
                    properties:
                      interface:
                        type: string
                        enum: [ 2.4GHZ, 5GHZ ]
                      enabled:
                        type: boolean
                      wirelessMode:
                        type: string
                        enum:
                          - 802.11B
                          - 802.11G
                          - 802.11BG
                          - 802.11BGN
                          - 802.11N
                          - 802.11A
                          - 802.11AN
                          - 802.11ACN
                          - 802.11AX  # 11AX can enable WIFI6
                      channel:
                        type: integer
                        minimum: 0
                        maximum: 196
                      ext_channel:
                        type: string
                        enum: [ lower, upper ]
                      channelActual:
                        type: integer
                        minimum: 1
                        maximum: 196
                      channelWidth:
                        type: string
                        enum:
                          - HT20
                          - HT20_40
                          - HT40
                          - HT80
                          - HT160  # for AN520 only
                      channelutilization:
                        type: string
                        minLength: 2
                        maxLength: 4
                      transmitPower:
                        type: integer
                      cts_rts_threshold:
                        type: integer
                        minimum: 1
                        maximum: 2346
                      qam256:
                        description: 2.4G only, not required
                        type: boolean
                      dfs:
                        description: 5G only, not required
                        type: boolean
                      client_limit_enabled:
                        type: boolean
                      client_limit:
                        type: integer
                        minimum: 1
                        maximum: 127
                  deviceId:
                    type: string
                    minLength: 17
                    maxLength: 17
                  errCode:
                    $ref: '#/components/schemas/errCodeEnum'
                  message:
                    type: string
                    enum: [ OK ]
