[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wfm"
version = "0.1.0"
description = "CLI tool for managing SnapOne Access Points (x20/x30) via REST APIs"
requires-python = ">=3.14.2"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.9",
    "cryptography>=44.0",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
wfm = "wfm.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
